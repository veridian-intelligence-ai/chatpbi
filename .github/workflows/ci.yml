# Lint, tipos, testes e build do backend e do frontend em todo push e pull request.
# Os testes não chamam o Power BI, o Claude, a OpenAI nem o WorkOS de verdade.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run tipos
      - run: npm test
      - run: npm run build
        env:
          # O build exige os endereços do backend (vite.config.ts); no CI, os do backend local.
          VITE_AUTH_BASE_URL: http://localhost:8080
          VITE_API_BASE_URL: http://localhost:8000
